name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Jalan otomatis setiap hari
  workflow_dispatch: # Bisa dijalankan manual via tab Actions

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate-pacman-svg
        uses: Platane/snk@v3
        with:
          github_user_name: niasur
          outputs: |
            dist/pacman-contribution-graph.svg?game=pacman
            dist/pacman-contribution-graph-dark.svg?game=pacman&theme=dark

      - name: push pacman-contribution-graph to the pacman-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
